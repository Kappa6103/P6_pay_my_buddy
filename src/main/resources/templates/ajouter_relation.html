<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <title>Page d'ajout d'une relation</title>
    <link href="style.css" rel="stylesheet">
</head>

<body>
    <h1>ajouter relation page</h1>
    <nav>
        <div>
            <a href="transfert">Transférer</a>
            <a href="profil">Profil</a>
            <a href="ajouter_relation">Ajouter relation</a>
            <form th:action="@{/logout}" method="post" style="display: inline;">
                <button>Se deconnecter</button>
            </form>
        </div>
    </nav>
    <hr />
    <div>Chercher une relation</div>
    <form method="post" th:action="@{/ajouter_relation}" th:object="${addRelationDto}">
        <div>
            <input th:field="${addRelationDto.email}">
            <p th:if="${#fields.hasErrors('email')}"
               th:errorclass="text-danger"
               th:errors="${addRelationDto.email}"></p>
        </div>
        <div>
            <button>Ajouter</button>
        </div>
    </form>


</body>

</html>
