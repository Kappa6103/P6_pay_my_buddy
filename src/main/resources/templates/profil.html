<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <title>Page de profil</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body>

    <nav>
        <div class="nav-container">
            <div class="nav-left">
                <Strong>Pay My Buddy</Strong>
            </div>
            <div class="nav-right">
                <a href="transfert">Transférer</a>
                <a href="profil" class="active">Profil</a>
                <a href="ajouter_relation">Ajouter relation</a>
                <form th:action="@{/logout}" method="post">
                    <input type="submit" value="Se déconnecter" class="logout-link">
                </form>
            </div>
        </div>
    </nav>

    <main>
        <div style="display: flex; justify-content: center; margin-top:160px">
            <form method="post" th:object="${modifyProfileDto}" th:action="@{/profil}">
                <input type="hidden" th:field="*{currentUserId}"/>

                <div class="profile-form">
                    <label>Username</label>
                    <div>
                        <input th:field="*{userName}" style="border: 0px" placeholder="@username">
                        <p th:if="${#fields.hasErrors('userName')}"
                           th:errorclass="text-danger"
                           th:errors="*{userName}"></p>
                    </div>
                </div>

                <div class="profile-form">
                    <label>Mail</label>
                    <div>
                        <input th:field="*{email}" style="border: 0px" placeholder="@email">
                        <p th:if="${#fields.hasErrors('email')}"
                           th:errorclass="text-danger"
                           th:errors="*{email}"></p>
                    </div>
                </div>

                <div class="profile-form">
                    <label>Password</label>
                    <div>
                        <input type="password" style="border: 0px" placeholder="@pwd"
                               th:field="*{password}">
                        <p th:if="${#fields.hasErrors('password')}"
                           th:errorclass="text-danger"
                           th:errors="*{password}"></p>
                    </div>
                </div>

                <div>
                    <button type="submit" class="yellow-button" style="position: relative; left: 400px; top: -50px">Modifier</button>
                </div>

                <div th:if="${#fields.hasGlobalErrors()}">
                    <p th:each="err : ${#fields.globalErrors()}" th:text="${err}">Error message</p>
                </div>
            </form>

        </div>

        <div th:if="${success}" role="alert">
            <strong>Updated</strong>
        </div>
    </main>
</body>

</html>
