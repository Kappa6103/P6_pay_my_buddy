<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <title>Page de profil</title>
    <link href="style.css" rel="stylesheet">
</head>

<body>
    <h1>Profile page</h1>
    <header>
        <nav>
            <div>
                <a href="transfert">Transférer</a>
                <a href="profil">Profil</a>
                <a href="ajouter_relation">Ajouter relation</a>
                <form th:action="@{/logout}" method="post" style="display: inline;">
                    <button>Se deconnecter</button>
                </form>
            </div>
        </nav>
    </header>
    <main>
        <div>
            <form method="post" th:object="${modifyProfileDto}" th:action="@{/profil}">
                <input type="hidden" th:field="*{currentUserId}"/>
                <label>Username</label>
                <div>
                    <input th:field="${modifyProfileDto.userName}">
                    <p th:if="${#fields.hasErrors('userName')}"
                       th:errorclass="text-danger"
                       th:errors="${modifyProfileDto.userName}"></p>
                </div>

                <label>Mail</label>
                <div>
                    <input th:field="${modifyProfileDto.email}">
                    <p th:if="${#fields.hasErrors('email')}"
                       th:errorclass="text-danger"
                       th:errors="${modifyProfileDto.email}"></p>
                </div>

                <label>Password</label>
                <div>
                    <input class="form-control" type="password"
                           th:field="${modifyProfileDto.password}">
                    <p th:if="${#fields.hasErrors('password')}"
                       th:errorclass="text-danger"
                       th:errors="${modifyProfileDto.password}"></p>
                </div>

                <div>
                    <button type="submit">Modifier</button>
                </div>

            </form>

        </div>
    </main>
</body>

</html>
