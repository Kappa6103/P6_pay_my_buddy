<!DOCTYPE html>

<html lang="fr"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Pay My Buddy - Login</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body>
    <header>
        <h1>Page de connexion</h1>
    </header>

    <main>
        <div class="display-center-class">
            <div class="container">

                <div class="box">
                    <a href="inscription">
                        <button class="subscribe-button">Pay My Buddy</button>
                    </a>
                </div>

                <div th:if="${param.error}" class="box">
                    Invalid username and password.</div>
                <div th:if="${param.logout}" class="box">
                    You have been logged out.</div>

                <form th:action="@{/connexion}" method="post">

                    <div class="input-field">
                        <input type="text" name="email" placeholder="Email" required/>
                    </div>

                    <div class="input-field">
                        <input type="password" name="password" placeholder="Password" required/>
                    </div>

                    <div class="box">
                        <input type="submit" value="Se connecter" class="blue-button"/>
                    </div>

                </form>
            </div>
        </div>

    </main>

</body>

</html>
